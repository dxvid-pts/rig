// Minimal Vertex AI (Google Cloud AI Platform) gRPC API proto for Rig.
//
// IMPORTANT: Field numbers and wire types are intentionally aligned with
// Google's official `google.cloud.aiplatform.v1` protos so the generated Rust
// types are gRPC-wire-compatible.
//
// Reference sources (field numbers/types):
// - google/cloud/aiplatform/v1/prediction_service.proto
// - google/cloud/aiplatform/v1/content.proto
// - google/cloud/aiplatform/v1/openapi.proto
// - google/cloud/aiplatform/v1/tool.proto

syntax = "proto3";

package google.cloud.aiplatform.v1;

service PredictionService {
  rpc GenerateContent(GenerateContentRequest) returns (GenerateContentResponse);
  rpc StreamGenerateContent(GenerateContentRequest) returns (stream GenerateContentResponse);
  rpc EmbedContent(EmbedContentRequest) returns (EmbedContentResponse);
}

// ================================================================
// google.protobuf.Struct / Value (mirrored)
// ================================================================

// Mirrors google.protobuf.NullValue.
enum NullValue {
  NULL_VALUE = 0;
}

// Mirrors google.protobuf.Value.
message Value {
  oneof kind {
    NullValue null_value = 1;
    double number_value = 2;
    string string_value = 3;
    bool bool_value = 4;
    Struct struct_value = 5;
    ListValue list_value = 6;
  }
}

// Mirrors google.protobuf.Struct.
message Struct {
  map<string, Value> fields = 1;
}

// Mirrors google.protobuf.ListValue.
message ListValue {
  repeated Value values = 1;
}

// ================================================================
// OpenAPI Schema (minimal)
// ================================================================

// Matches google.cloud.aiplatform.v1.Type (openapi.proto).
enum Type {
  TYPE_UNSPECIFIED = 0;
  STRING = 1;
  NUMBER = 2;
  INTEGER = 3;
  BOOLEAN = 4;
  ARRAY = 5;
  OBJECT = 6;
}

// Matches google.cloud.aiplatform.v1.Schema (openapi.proto) for basic use.
message Schema {
  Type type = 1;
  Schema items = 2;
  map<string, Schema> properties = 3;
  Value example = 4;
  repeated string required = 5;
  bool nullable = 6;
  string format = 7;
  string description = 8;
  repeated string enum = 9;
  repeated Schema any_of = 11;
  string title = 24;
  Value additional_properties = 26;
  string ref = 27;
  map<string, Schema> defs = 28;
}

// ================================================================
// Content types (minimal)
// ================================================================

message Content {
  string role = 1;
  repeated Part parts = 2;
}

message Part {
  oneof data {
    string text = 1;
    Blob inline_data = 2;
    FileData file_data = 3;
    FunctionCall function_call = 5;
    FunctionResponse function_response = 6;
    ExecutableCode executable_code = 8;
    CodeExecutionResult code_execution_result = 9;
  }

  bool thought = 10;
  bytes thought_signature = 11;
}

message Blob {
  string mime_type = 1;
  bytes data = 2;
}

message FileData {
  string mime_type = 1;
  string file_uri = 2;
}

// ================================================================
// Tools (minimal)
// ================================================================

message Tool {
  repeated FunctionDeclaration function_declarations = 1;
}

message ToolConfig {
  FunctionCallingConfig function_calling_config = 1;
}

message FunctionCallingConfig {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    AUTO = 1;
    ANY = 2;
    NONE = 3;
  }

  Mode mode = 1;
  repeated string allowed_function_names = 2;
  bool stream_function_call_arguments = 4;
}

message FunctionDeclaration {
  string name = 1;
  string description = 2;
  Schema parameters = 3;
  Schema response = 4;
  Value parameters_json_schema = 5;
  Value response_json_schema = 6;
}

message FunctionCall {
  string name = 1;
  Struct args = 2;
}

message FunctionResponse {
  string name = 1;
  Struct response = 2;
}

message ExecutableCode {
  enum Language {
    LANGUAGE_UNSPECIFIED = 0;
    PYTHON = 1;
  }

  Language language = 1;
  string code = 2;
}

message CodeExecutionResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_OK = 1;
    OUTCOME_FAILED = 2;
    OUTCOME_DEADLINE_EXCEEDED = 3;
  }

  Outcome outcome = 1;
  string output = 2;
}

// ================================================================
// Generation (minimal)
// ================================================================

message ThinkingConfig {
  optional bool include_thoughts = 1;
  optional int32 thinking_budget = 3;
}

message GenerationConfig {
  optional float temperature = 1;
  optional float top_p = 2;
  optional float top_k = 3;
  optional int32 candidate_count = 4;
  optional int32 max_output_tokens = 5;
  repeated string stop_sequences = 6;
  optional int32 seed = 12;

  string response_mime_type = 13;
  Schema response_schema = 16;
  Value response_json_schema = 28;

  ThinkingConfig thinking_config = 25;
}

message SafetySetting {}

message ModelArmorConfig {}

message GenerateContentRequest {
  string model = 5;
  repeated Content contents = 2;
  Content system_instruction = 8;
  string cached_content = 9;
  repeated Tool tools = 6;
  ToolConfig tool_config = 7;
  map<string, string> labels = 10;
  repeated SafetySetting safety_settings = 3;
  ModelArmorConfig model_armor_config = 11;
  GenerationConfig generation_config = 4;
}

message UsageMetadata {
  int32 prompt_token_count = 1;
  int32 candidates_token_count = 2;
  int32 total_token_count = 3;
  int32 cached_content_token_count = 5;
  int32 thoughts_token_count = 14;
}

message Candidate {
  enum FinishReason {
    FINISH_REASON_UNSPECIFIED = 0;
    STOP = 1;
    MAX_TOKENS = 2;
    SAFETY = 3;
    RECITATION = 4;
    OTHER = 5;
    BLOCKLIST = 6;
    PROHIBITED_CONTENT = 7;
    SPII = 8;
    MALFORMED_FUNCTION_CALL = 9;
    MODEL_ARMOR = 10;
  }

  int32 index = 1;
  Content content = 2;
  FinishReason finish_reason = 3;
  optional string finish_message = 5;
}

message PromptFeedback {}

message GenerateContentResponse {
  repeated Candidate candidates = 2;
  string model_version = 11;
  string response_id = 13;
  PromptFeedback prompt_feedback = 3;
  UsageMetadata usage_metadata = 4;
}

// ================================================================
// Embeddings
// ================================================================

message EmbedContentRequest {
  enum EmbeddingTaskType {
    UNSPECIFIED = 0;
    RETRIEVAL_QUERY = 2;
    RETRIEVAL_DOCUMENT = 3;
    SEMANTIC_SIMILARITY = 4;
    CLASSIFICATION = 5;
    CLUSTERING = 6;
    QUESTION_ANSWERING = 7;
    FACT_VERIFICATION = 8;
    CODE_RETRIEVAL_QUERY = 9;
  }

  optional string model = 1;
  optional Content content = 2;
  optional string title = 4;
  optional EmbeddingTaskType task_type = 5;
  optional int32 output_dimensionality = 6;
  optional bool auto_truncate = 7;
}

message EmbedContentResponse {
  message Embedding {
    repeated float values = 1;
  }

  Embedding embedding = 1;
  UsageMetadata usage_metadata = 2;
  bool truncated = 4;
}
